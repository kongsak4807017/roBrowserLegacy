name: Asset Bootstrap Verification

on:
  pull_request:
    paths:
      - 'src/Assets/**'
      - 'tests/Assets/**'
      - '.github/workflows/asset-bootstrap-verification.yml'
      - 'package.json'
  push:
    branches:
      - feature/asset-server-first
    paths:
      - 'src/Assets/**'
      - 'tests/Assets/**'
      - '.github/workflows/asset-bootstrap-verification.yml'
      - 'package.json'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run focused tests
        run: npx vitest run tests/Assets/AssetBootstrap.test.js

      - name: Run focused lint
        run: npx eslint src/Assets/AssetBootstrap.js tests/Assets/AssetBootstrap.test.js --max-warnings 0

      - name: Check focused formatting
        run: npx prettier --check src/Assets/AssetBootstrap.js tests/Assets/AssetBootstrap.test.js
